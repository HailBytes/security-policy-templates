name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: sudo apt-get install -y shellcheck
      - name: Lint customize.sh
        run: shellcheck scripts/customize.sh
      - name: Lint check_links.sh
        run: shellcheck scripts/check_links.sh

  markdown-links:
    name: Markdown link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify relative markdown links resolve to real files
        run: bash scripts/check_links.sh

  placeholder-coverage:
    name: Placeholder coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run customize.sh with all flags and verify no core placeholders remain
        run: |
          set -euo pipefail

          tmpdir=$(mktemp -d)

          bash scripts/customize.sh \
            --company "Test Corp" \
            --date "2025-01-01" \
            --it-contact "it@test.com" \
            --sec-officer "Jane Smith" \
            --review-date "2026-01-01" \
            --industry "Finance" \
            --title-role "IT Manager" \
            --legal-contact "legal@test.com" \
            --maint-day "Tuesday" \
            --maint-time "02:00-04:00 UTC" \
            --primary-app "Acme ERP" \
            --secondary-apps "Slack, Jira" \
            --cm-tool "Jira Service Management" \
            --output-dir "$tmpdir"

          # Check that no core configuration placeholders remain in any customized directory
          remaining=$(grep -rn --include="*.md" \
            -E '\[(Company Name|Date|IT Contact|Security Officer|Review Date|Department|Industry|Title/Role|Contact Info|Day of week|Time range|Primary business application|Secondary applications|Change Management Tool)\]' \
            "$tmpdir/policies" "$tmpdir/templates" "$tmpdir/industry-variants" "$tmpdir/docs" 2>/dev/null || true)

          if [[ -n "$remaining" ]]; then
            echo "ERROR: Core placeholders still present after full customization:"
            echo "$remaining"
            exit 1
          fi

          echo "All core policy placeholders replaced successfully."

  csf20-compliance:
    name: NIST CSF 2.0 compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for stale CSF 1.1-only codes (removed in CSF 2.0)
        run: |
          set -euo pipefail
          # Codes that were removed from NIST CSF 2.0 (Feb 2024): ID.GV, ID.SC,
          # ID.BE, PR.IP, PR.PT, PR.MA, and RS.RP/RS.AN-01..05 (renamed/merged
          # into RS.MA). RS.AN-06+ survive in 2.0 and are NOT flagged.
          # Also flag RC.IM/RS.IM which are author typos for ID.IM/RS.MA.
          found=$(grep -rn --include="*.md" \
            -E 'ID\.GV-[0-9]|ID\.SC-[0-9]|ID\.BE-[0-9]|PR\.IP-[0-9]|PR\.PT-[0-9]|PR\.MA-[0-9]|RS\.RP-[0-9]|RS\.MI-[0-9]|RS\.AN-0[1-5]|RC\.IM-|RS\.IM-' \
            policies/ docs/ CONTRIBUTING.md 2>/dev/null || true)
          if [[ -n "$found" ]]; then
            echo "ERROR: Stale CSF 1.1-only codes still present (removed in CSF 2.0):"
            echo "$found"
            exit 1
          fi
          echo "All policy files use only CSF 2.0 codes."
