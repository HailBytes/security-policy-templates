name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: sudo apt-get install -y shellcheck
      - name: Lint customize.sh
        run: shellcheck scripts/customize.sh

  placeholder-coverage:
    name: Placeholder coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run customize.sh with all flags and verify no core placeholders remain
        run: |
          set -euo pipefail

          tmpdir=$(mktemp -d)

          bash scripts/customize.sh \
            --company "Test Corp" \
            --date "2025-01-01" \
            --it-contact "it@test.com" \
            --sec-officer "Jane Smith" \
            --review-date "2026-01-01" \
            --department "IT" \
            --industry "Finance" \
            --title-role "IT Manager" \
            --legal-contact "legal@test.com" \
            --maint-day "Tuesday" \
            --maint-time "02:00-04:00 UTC" \
            --primary-app "Acme ERP" \
            --secondary-apps "Slack, Jira" \
            --output-dir "$tmpdir"

          # Check that no core configuration placeholders remain in any customized directory
          remaining=$(grep -rn --include="*.md" \
            -E '\[(Company Name|Date|IT Contact|Security Officer|Review Date|Department|Industry|Title/Role|Contact Info|Day of week|Time range|Primary business application|Secondary applications)\]' \
            "$tmpdir/policies" "$tmpdir/templates" "$tmpdir/industry-variants" "$tmpdir/docs" 2>/dev/null || true)

          if [[ -n "$remaining" ]]; then
            echo "ERROR: Core placeholders still present after full customization:"
            echo "$remaining"
            exit 1
          fi

          echo "All core policy placeholders replaced successfully."
